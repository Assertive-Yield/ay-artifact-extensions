name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifest-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(jq -er '.version' .claude-plugin/plugin.json)
          for other in "$(jq -er '.version' plugin.json)" "$(jq -er '.plugins[] | select(.name == "ay-artifacts") | .version' .claude-plugin/marketplace.json)" "$(jq -er '.version' gemini-extension.json)" "$(jq -er '.version' .antigravity-plugin/plugin.json)"; do
            [ "$other" = "$version" ] || { echo "ay-artifacts: versions differ ($version, $other)"; exit 1; }
          done
          grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  plugin-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-plugin-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: dist/*.zip
