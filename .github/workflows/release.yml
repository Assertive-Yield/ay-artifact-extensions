name: release

# A tag v<version> publishes the zips as assets of a GitHub release, whose .../releases/latest/download/ links
# are the download links the README gives.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: ./scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
