# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
- release
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
secret_detection:
  stage: secret-detection

manifest-versions:
  stage: test
  image: alpine:3.20
  script:
    - apk add --no-cache jq
    - |
      version=$(jq -er '.version' .claude-plugin/plugin.json)
      for other in "$(jq -er '.version' plugin.json)" "$(jq -er '.plugins[] | select(.name == "ay-artifacts") | .version' .claude-plugin/marketplace.json)"; do
        [ "$other" = "$version" ] || { echo "ay-artifacts: versions differ ($version, $other)"; exit 1; }
      done
      grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

plugin-tests:
  stage: test
  image: node:22-alpine
  script:
    - node --test tests/*.test.mjs

plugin-zip:
  stage: test
  image: python:3.14-alpine
  script:
    - apk add --no-cache jq
    - ./scripts/build-plugin-zip.sh
  artifacts:
    paths:
      - dist/*.zip

# A tag v<version> publishes the zip: uploaded to the package registry, then linked from a release whose
# "latest" permalink is the download link the README gives.
release:
  stage: release
  image: python:3.14-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - apk add --no-cache jq curl
    - ./scripts/release.sh
