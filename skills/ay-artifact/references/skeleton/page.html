<header class="page-header">
    <div>
        <h1 id="title">Yield overview</h1>
        <p id="subtitle" class="muted"></p>
    </div>
    <div class="controls">
        <label>From <input type="date" id="start"></label>
        <label>To <input type="date" id="end"></label>
        <button type="button" id="apply">Apply</button>
    </div>
</header>

<p id="notice" class="state error" hidden></p>

<section class="panel" id="totals">
    <h2>Totals</h2>
    <div class="panel-body" data-body></div>
</section>

<section class="panel" id="trend">
    <h2>Trend</h2>
    <div class="panel-body" data-body></div>
</section>

<section class="panel" id="breakdown">
    <h2>Breakdown</h2>
    <div class="panel-body" data-body></div>
</section>
